name: Build Executables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: youtube-downloader-linux
            asset_name: youtube-downloader-linux-x64
          - os: windows-latest
            artifact_name: youtube-downloader.exe
            asset_name: youtube-downloader-windows-x64.exe
          - os: macos-14
            artifact_name: youtube-downloader
            asset_name: youtube-downloader-macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          wget https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          tar xf ffmpeg-release-amd64-static.tar.xz
          mkdir -p ffmpeg_bin
          cp ffmpeg-*-amd64-static/ffmpeg ffmpeg_bin/
          cp ffmpeg-*-amd64-static/ffprobe ffmpeg_bin/
          chmod +x ffmpeg_bin/ffmpeg ffmpeg_bin/ffprobe

      - name: Download FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path ffmpeg.zip -DestinationPath .
          mkdir ffmpeg_bin
          copy ffmpeg-*-essentials_build\bin\ffmpeg.exe ffmpeg_bin\
          copy ffmpeg-*-essentials_build\bin\ffprobe.exe ffmpeg_bin\

      - name: Download FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          wget https://evermeet.cx/ffmpeg/getrelease/ffmpeg/zip
          wget https://evermeet.cx/ffmpeg/getrelease/ffprobe/zip -O ffprobe.zip
          unzip -o zip -d ffmpeg_bin
          unzip -o ffprobe.zip -d ffmpeg_bin
          chmod +x ffmpeg_bin/ffmpeg ffmpeg_bin/ffprobe

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller youtube_downloader.spec

      - name: Rename artifact (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mv dist/youtube-downloader dist/${{ matrix.asset_name }}

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          move dist\youtube-downloader.exe dist\${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/${{ matrix.asset_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
