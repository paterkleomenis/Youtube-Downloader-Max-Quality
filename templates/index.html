<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>YouTube Video Downloader</title>
        <link
            rel="stylesheet"
            href="{{ url_for('static', path='styles.css') }}"
        />
        <link
            rel="icon"
            href="{{ url_for('static', path='images/im2.png') }}"
            type="image/png"
        />
    </head>
    <body>
        <div class="logo-container">
            <img
                src="{{ url_for('static', path='images/im2.png') }}"
                alt="Site Logo"
                class="site-logo"
            />
        </div>

        <div style="position: fixed; top: 10px; right: 10px; z-index: 1000">
            <button
                onclick="checkForUpdates()"
                id="updateButton"
                style="
                    padding: 6px 12px;
                    background-color: rgba(245, 101, 101, 0.9);
                    color: white;
                    border: none;
                    border-radius: 20px;
                    cursor: pointer;
                    font-size: 12px;
                    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
                    transition: all 0.3s ease;
                "
                onmouseover="this.style.backgroundColor='rgba(245, 101, 101, 1)'; this.style.transform='scale(1.05)'"
                onmouseout="this.style.backgroundColor='rgba(245, 101, 101, 0.9)'; this.style.transform='scale(1)'"
            >
                🔄 Updates
            </button>
            <div
                id="updateInfo"
                style="
                    margin-top: 5px;
                    font-size: 11px;
                    background: rgba(45, 45, 45, 0.98);
                    padding: 8px;
                    border-radius: 8px;
                    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
                    max-width: 200px;
                    display: none;
                    color: white;
                "
            ></div>
        </div>

        <div class="container">
            <div class="info-container">
                <div class="input-group">
                    <input
                        type="text"
                        id="videoUrl"
                        placeholder="Enter Video URL:"
                        onkeydown="checkEnter(event)"
                    />
                    <button onclick="fetchVideoInfo()">Search</button>
                </div>
                <div id="loading" class="loading" style="display: none">
                    <div class="spinner"></div>
                    Loading...
                </div>
                <!-- Loading message -->
                <div id="videoInfo">
                    <h2 id="videoTitle"></h2>
                    <div class="resolutions">
                        <h3>Available Resolutions:</h3>
                        <ul id="resolutionList"></ul>
                    </div>
                    <div id="audioDownload" style="display: none">
                        <!-- Initially hidden -->
                        <h3>Download Audio:</h3>
                        <button onclick="downloadAudioFormat('webm')">
                            Default (WEBM)
                        </button>
                        <button onclick="downloadAudioFormat('mp3')">
                            MP3
                        </button>
                        <button onclick="downloadAudioFormat('ogg')">
                            OGG
                        </button>
                        <button onclick="downloadAudioFormat('aac')">
                            AAC
                        </button>
                        <button onclick="downloadAudioFormat('wav')">
                            WAV
                        </button>
                        <button onclick="downloadAudioFormat('flac')">
                            FLAC
                        </button>
                        <button onclick="downloadAudioFormat('m4a')">
                            M4A
                        </button>
                    </div>
                    <div
                        id="progressWrapper"
                        class="progress-wrapper"
                        style="display: none"
                    >
                        <!-- Hide by default -->
                        <div class="progress-bar">
                            <div
                                id="progress"
                                class="progress"
                                style="width: 0%"
                            ></div>
                        </div>
                        <div id="progressText" class="progress-text"></div>
                    </div>
                </div>
            </div>
            <div class="thumbnail-container">
                <img
                    id="thumbnail"
                    class="thumbnail"
                    src=""
                    alt="Video Thumbnail"
                    style="display: none"
                />
            </div>
        </div>

        <script src="{{ url_for('static', path='script.js') }}"></script>
        <script>
            async function checkForUpdates() {
                const updateButton = document.getElementById("updateButton");
                const updateInfo = document.getElementById("updateInfo");

                updateButton.disabled = true;
                updateButton.textContent = "⏳";
                updateInfo.style.display = "block";
                updateInfo.innerHTML =
                    '<span style="color: #ccc;">Checking...</span>';

                try {
                    const response = await fetch("/api/check_updates");
                    const data = await response.json();

                    if (data.update_available) {
                        updateInfo.style.display = "block";
                        updateInfo.innerHTML = `
                            <div style="color: #ff9800; font-weight: bold;">Update available!</div>
                            <div style="font-size: 10px; color: #ccc; margin: 3px 0;">${data.current_version} → ${data.latest_version}</div>
                            <button onclick="installUpdate()" style="padding: 4px 10px; background-color: #f56565; color: white; border: none; border-radius: 12px; cursor: pointer; font-size: 11px; width: 100%;">
                                Install
                            </button>
                        `;
                    } else if (data.current_version) {
                        updateInfo.style.display = "block";
                        updateInfo.innerHTML = `<span style="color: #4CAF50;">✅ Up to date<br><small style="color: #ccc;">${data.current_version}</small></span>`;
                        setTimeout(() => {
                            updateInfo.style.display = "none";
                        }, 3000);
                    } else {
                        updateInfo.style.display = "block";
                        updateInfo.innerHTML = `<span style="color: #ccc;">Check failed</span>`;
                        setTimeout(() => {
                            updateInfo.style.display = "none";
                        }, 3000);
                    }
                } catch (error) {
                    updateInfo.style.display = "block";
                    updateInfo.innerHTML = `<span style="color: #f44336;">Error</span>`;
                    setTimeout(() => {
                        updateInfo.style.display = "none";
                    }, 3000);
                    console.error("Update check failed:", error);
                } finally {
                    updateButton.disabled = false;
                    updateButton.textContent = "🔄 Updates";
                }
            }

            async function installUpdate() {
                const updateInfo = document.getElementById("updateInfo");
                updateInfo.style.display = "block";
                updateInfo.innerHTML =
                    '<span style="color: #ccc;">Installing...</span>';

                try {
                    const response = await fetch("/api/update_ytdlp", {
                        method: "POST",
                    });
                    const data = await response.json();

                    if (data.success) {
                        updateInfo.innerHTML = `<span style="color: #4CAF50;">✅ Updated!<br><small>${data.new_version}</small></span>`;
                        setTimeout(() => {
                            updateInfo.style.display = "none";
                        }, 5000);
                    } else {
                        updateInfo.innerHTML = `<span style="color: #f44336;">❌ Failed<br><small>${data.message}</small></span>`;
                        setTimeout(() => {
                            updateInfo.style.display = "none";
                        }, 5000);
                    }
                } catch (error) {
                    updateInfo.innerHTML = `<span style="color: #f44336;">Install error</span>`;
                    setTimeout(() => {
                        updateInfo.style.display = "none";
                    }, 3000);
                    console.error("Update installation failed:", error);
                }
            }
        </script>
    </body>
</html>
