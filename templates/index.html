<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>YouTube Video Downloader</title>
        <link
            rel="stylesheet"
            href="{{ url_for('static', path='styles.css') }}"
        />
        <link
            rel="icon"
            href="{{ url_for('static', path='images/im2.png') }}"
            type="image/png"
        />
    </head>
    <body>
        <div class="logo-container">
            <img
                src="{{ url_for('static', path='images/im2.png') }}"
                alt="Site Logo"
                class="site-logo"
            />
        </div>

        <div style="text-align: center; margin: 10px 0">
            <button
                onclick="checkForUpdates()"
                id="updateButton"
                style="
                    padding: 8px 16px;
                    background-color: #4caf50;
                    color: white;
                    border: none;
                    border-radius: 4px;
                    cursor: pointer;
                    font-size: 14px;
                "
            >
                🔄 Check for Updates
            </button>
            <div
                id="updateInfo"
                style="margin-top: 10px; font-size: 14px"
            ></div>
        </div>

        <div class="container">
            <div class="info-container">
                <div class="input-group">
                    <input
                        type="text"
                        id="videoUrl"
                        placeholder="Enter Video URL:"
                        onkeydown="checkEnter(event)"
                    />
                    <button onclick="fetchVideoInfo()">Search</button>
                </div>
                <div id="loading" class="loading" style="display: none">
                    <div class="spinner"></div>
                    Loading...
                </div>
                <!-- Loading message -->
                <div id="videoInfo">
                    <h2 id="videoTitle"></h2>
                    <div class="resolutions">
                        <h3>Available Resolutions:</h3>
                        <ul id="resolutionList"></ul>
                    </div>
                    <div id="audioDownload" style="display: none">
                        <!-- Initially hidden -->
                        <h3>Download Audio:</h3>
                        <button onclick="downloadAudioFormat('webm')">
                            Default (WEBM)
                        </button>
                        <button onclick="downloadAudioFormat('mp3')">
                            MP3
                        </button>
                        <button onclick="downloadAudioFormat('ogg')">
                            OGG
                        </button>
                        <button onclick="downloadAudioFormat('aac')">
                            AAC
                        </button>
                        <button onclick="downloadAudioFormat('wav')">
                            WAV
                        </button>
                        <button onclick="downloadAudioFormat('flac')">
                            FLAC
                        </button>
                        <button onclick="downloadAudioFormat('m4a')">
                            M4A
                        </button>
                    </div>
                    <div
                        id="progressWrapper"
                        class="progress-wrapper"
                        style="display: none"
                    >
                        <!-- Hide by default -->
                        <div class="progress-bar">
                            <div
                                id="progress"
                                class="progress"
                                style="width: 0%"
                            ></div>
                        </div>
                        <div id="progressText" class="progress-text"></div>
                    </div>
                </div>
            </div>
            <div class="thumbnail-container">
                <img
                    id="thumbnail"
                    class="thumbnail"
                    src=""
                    alt="Video Thumbnail"
                    style="display: none"
                />
            </div>
        </div>

        <script src="{{ url_for('static', path='script.js') }}"></script>
        <script>
            async function checkForUpdates() {
                const updateButton = document.getElementById("updateButton");
                const updateInfo = document.getElementById("updateInfo");

                updateButton.disabled = true;
                updateButton.textContent = "🔄 Checking...";
                updateInfo.innerHTML =
                    '<span style="color: #666;">Checking for updates...</span>';

                try {
                    const response = await fetch("/api/check_updates");
                    const data = await response.json();

                    if (data.update_available) {
                        updateInfo.innerHTML = `
                            <span style="color: #ff9800;">Update available: ${data.current_version} → ${data.latest_version}</span><br>
                            <button onclick="installUpdate()" style="margin-top: 5px; padding: 6px 12px; background-color: #ff9800; color: white; border: none; border-radius: 4px; cursor: pointer;">
                                Install Update
                            </button>
                        `;
                    } else if (data.current_version) {
                        updateInfo.innerHTML = `<span style="color: #4CAF50;">✅ Up to date (${data.current_version})</span>`;
                    } else {
                        updateInfo.innerHTML = `<span style="color: #666;">Could not check for updates</span>`;
                    }
                } catch (error) {
                    updateInfo.innerHTML = `<span style="color: #f44336;">Error checking updates</span>`;
                    console.error("Update check failed:", error);
                } finally {
                    updateButton.disabled = false;
                    updateButton.textContent = "🔄 Check for Updates";
                }
            }

            async function installUpdate() {
                const updateInfo = document.getElementById("updateInfo");
                updateInfo.innerHTML =
                    '<span style="color: #666;">Installing update...</span>';

                try {
                    const response = await fetch("/api/update_ytdlp", {
                        method: "POST",
                    });
                    const data = await response.json();

                    if (data.success) {
                        updateInfo.innerHTML = `<span style="color: #4CAF50;">✅ ${data.message}</span>`;
                    } else {
                        updateInfo.innerHTML = `<span style="color: #f44336;">❌ ${data.message}</span>`;
                    }
                } catch (error) {
                    updateInfo.innerHTML = `<span style="color: #f44336;">Error installing update</span>`;
                    console.error("Update installation failed:", error);
                }
            }
        </script>
    </body>
</html>
