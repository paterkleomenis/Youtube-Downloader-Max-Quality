<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader - Max Quality</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="icon" type="image/png" href="/static/images/im.png">
</head>
<body>
    <!-- Update Notification Bar -->
    <div id="updateBar" class="update-bar hidden">
        <span>New version available: <span id="newVersionBadge">v2.0.1</span></span>
        <button id="triggerUpdateBtn" class="btn-sm primary-btn">Update Now</button>
    </div>

    <div class="app-container">
        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Centered Logo -->
            <div class="centered-logo">
                <img src="/static/images/im.png" alt="Logo" class="main-logo-image">
            </div>

            <!-- Search Section -->
            <section class="search-section">
                <div class="input-group glass-panel">
                    <input type="text" id="urlInput" placeholder="Paste YouTube Link Here..." autocomplete="off">
                    <button id="fetchBtn" class="primary-btn">
                        <i class="fa-solid fa-magnifying-glass"></i> Analyze
                    </button>
                    <!-- Mode Switch for Simple/Advanced Options -->
                    <div class="mode-switch-wrapper" title="Toggle Advanced Mode">
                        <span class="switch-label">Simple</span>
                        <label class="switch">
                            <input type="checkbox" id="modeToggle">
                            <span class="slider round"></span>
                        </label>
                        <span class="switch-label">Advanced</span>
                    </div>
                </div>
            </section>

            <!-- Video Info & Options (Hidden initially) -->
            <section id="videoInfoSection" class="video-info-section hidden">
                <div class="video-card glass-panel">
                    <div class="video-thumbnail">
                        <img id="thumbnailImg" src="" alt="Video Thumbnail">
                        <span class="duration-badge" id="videoDuration">00:00</span>
                    </div>
                    <div class="video-details">
                        <h2 id="videoTitle" class="video-title">Video Title</h2>
                        <p id="videoChannel" class="channel-name">Channel Name</p>
                        
                        <!-- Simple Mode Options -->
                        <div id="simpleOptions" class="download-options">
                            <div class="option-group">
                                <label>Format:</label>
                                <div class="format-buttons">
                                    <button class="format-btn active" data-type="video">Video</button>
                                    <button class="format-btn" data-type="audio">Audio</button>
                                </div>
                            </div>
                            
                            <div class="option-group" id="qualityGroup">
                                <label>Quality:</label>
                                <select id="simpleQualitySelect" class="styled-select">
                                    <!-- Populated by JS -->
                                </select>
                            </div>
                            
                            <div class="option-group hidden" id="audioFormatGroup">
                                <label>Audio Format:</label>
                                <select id="audioFormatSelect" class="styled-select">
                                    <option value="mp3">MP3 (Universal)</option>
                                    <option value="m4a">M4A (Best Quality)</option>
                                    <option value="wav">WAV (Lossless)</option>
                                </select>
                            </div>
                        </div>

                        <!-- Advanced Mode Options -->
                        <div id="advancedOptions" class="download-options hidden">
                            <div class="table-container">
                                <table class="formats-table">
                                    <thead>
                                        <tr>
                                            <th>Ext</th>
                                            <th>Resolution</th>
                                            <th>Codec</th>
                                            <th>Size (Est)</th>
                                            <th>Action</th>
                                        </tr>
                                    </thead>
                                    <tbody id="formatsTableBody">
                                        <!-- Populated by JS -->
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div class="action-area" id="mainActionArea">
                            <button id="downloadBtn" class="download-btn">
                                <i class="fa-solid fa-download"></i> Start Download
                            </button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Active Downloads Queue -->
            <section id="downloadsSection" class="downloads-section hidden">
                <h3>Active Downloads</h3>
                <div id="downloadsList" class="downloads-list">
                    <!-- Download Cards injected here -->
                </div>
            </section>
        </main>


    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal">
        <div class="modal-content glass-panel">
            <span class="close-modal">&times;</span>
            <h2>Settings</h2>
            <div class="setting-item">
                <label>Theme</label>
                <select id="themeSelect">
                    <option value="dark">Dark</option>
                    <option value="light">Light</option>
                </select>
            </div>
            <!-- More settings can go here -->
             <div class="setting-item">
                <button id="checkUpdatesBtn" class="secondary-btn">Check for Updates</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="/static/script.js"></script>
</body>
</html>
